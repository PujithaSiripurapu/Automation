name: Pest Control book & cancel (every 2 hours)

on:
  schedule:
    # Every 2 hours, on the hour (UTC). GitHub may start scheduled runs a few minutes late.
    - cron: '0 */2 * * *'
  workflow_dispatch: # "Run workflow" button for manual runs

concurrency:
  group: pest-book-cancel
  cancel-in-progress: false

jobs:
  book-and-cancel:
    runs-on: ubuntu-latest
    # Room to wait out an OTP rate limit (up to 10 min) on top of the ~1 min test.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Reuse a saved login so we only request an OTP when it has expired (the site
      # rate-limits OTP requests per phone number): newest cached session first (shared
      # with playwright.yml), else the UTILSTOP_AUTH_STATE secret.
      - name: Restore saved login session
        uses: actions/cache/restore@v4
        with:
          path: playwright/.auth
          key: utilstop-auth-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: utilstop-auth-

      - name: Seed login session from secret if none cached
        env:
          AUTH_STATE: ${{ secrets.UTILSTOP_AUTH_STATE }}
        run: |
          f=playwright/.auth/uae-user.dev.utilstop.com.json
          if [ ! -f "$f" ] && [ -n "$AUTH_STATE" ]; then
            mkdir -p playwright/.auth && printf '%s' "$AUTH_STATE" > "$f" && echo "Seeded login session from secret"
          fi
          if [ -f "$f" ]; then echo "Login session available"; else echo "No saved session: test will request an OTP"; fi

      - name: Book Pest Control, then cancel it
        id: test
        env:
          HEADLESS: '1'
          PLAYWRIGHT_HTML_OPEN: never
        # One retry for a flaky dev server; the retry reuses the session saved by the first attempt.
        run: npx playwright test tests/pest-control-book-and-cancel.spec.ts --project=chromium --reporter=line,html --retries=1

      # Saved even when the test fails, so a successful OTP login is never thrown away.
      - name: Save login session for the next run
        if: ${{ !cancelled() && hashFiles('playwright/.auth/*.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: playwright/.auth
          key: utilstop-auth-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Email the report
        if: ${{ !cancelled() }}
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          TEST_STATUS: ${{ steps.test.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node send-report.js

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: pest-book-cancel-report
          path: playwright-report/
          retention-days: 14
